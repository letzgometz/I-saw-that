/* ============ dates ============ */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
// If the model only left us the printed text, read a month and year out of it.
function inferFromPrinted(text){
  if(!text) return "";
  const t = String(text).toLowerCase();
  const years = (t.match(/\b(?:19|20)\d{2}\b/g) || []);
  if(!years.length) return "";
  // "2011-2012 Season" spans two years — too vague to file as either
  if(years.length > 1 && years[0] !== years[1]) return "";
  const months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const i = months.findIndex(m => t.includes(m));
  return i > -1 ? years[0] + "-" + String(i + 1).padStart(2, "0") : years[0];
}

function precisionOf(v){ if(!v) return null; if(v.length>=10) return "day"; if(v.length===7) return "month"; return "year"; }
function fmtDate(v){
  const p = precisionOf(v); if(!p) return "Date not recorded";
  const a = v.split("-");
  if(p==="year") return a[0];
  if(p==="month") return MONTHS[+a[1]-1] + " " + a[0];
  return MONTHS[+a[1]-1] + " " + (+a[2]) + ", " + a[0];
}
function stubParts(v){
  const p = precisionOf(v);
  if(!p) return { eyebrow:"", big:"—", sub:"undated" };
  const a = v.split("-"), mon = (MONTHS[+a[1]-1]||"").slice(0,3).toUpperCase();
  if(p==="year") return { eyebrow:"", big:a[0], sub:"" };
  if(p==="month") return { eyebrow:mon, big:a[0], sub:"" };
  return { eyebrow:mon, big:String(+a[2]), sub:a[0] };
}

/* ============ images ============ */
function loadImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read that image."));
    r.onload = () => { const img = new Image();
      img.onerror = () => reject(new Error("That photo would not open — if it is a HEIC file, open it in Photos and share it as JPEG, or take the shot with your camera set to Most Compatible."));
      img.onload = () => resolve(img); img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function encode(img, maxDim, q){
  const s = Math.min(1, maxDim / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function preparePage(file, i){
  const img = await loadImage(file);
  let archive = encode(img, 1100, .62);
  if (archive.length > 850000) archive = encode(img, 800, .55);  // stay under Firestore's 1 MB document limit
  return { id: "p_" + Date.now() + "_" + i, read: encode(img, 1400, .75), full: archive, thumb: encode(img, 300, .55) };
}

/* ============ reading a program ============ */
const BUILD = "v20";
const KINDS = ["Theatre", "Musical", "Opera", "Classical", "Jazz", "Cabaret", "Dance", "Other"];
function kindOf(e){ return (e && KINDS.includes(e.kind)) ? e.kind : "Unsorted"; }

const PROMPT = 'These images relate to a single live performance the user attended, in the order they were added. Most are pages from its program: the title may be on the cover, the run of dates inside, the cast elsewhere, an understudy slip loose in the book. One may instead be a TICKET, ticket stub, box-office receipt, will-call slip or booking confirmation. Read every image and merge what you find into one record. Where images disagree, this is the order of authority: (1) a ticket or booking confirmation, (2) a slip or insert printed for this performance, (3) the program pages, (4) a season or repertory book covering many productions. Return ONLY a JSON object, no markdown fences and no commentary:\n' +
'{"title":"","kind":"","director":"","company":"","venue":"","city":"","dateInfo":{"exact":"","monthYear":"","rangeStart":"","rangeEnd":"","printed":""},"creatives":[{"role":"","name":""}],"cast":[{"actor":"","role":""}],"understudies":[{"actor":"","role":""}],"notes":""}\n' +
'Rules: title is the production name. kind is exactly one of Theatre, Musical, Opera, Classical, Jazz, Cabaret, Dance, Other — judge from the program (a play is Theatre, a book musical is Musical, a symphony or recital is Classical, a jazz club or festival set is Jazz, a solo song evening is Cabaret, ballet or contemporary dance is Dance). company is the producing theatre or opera company if named. dateInfo: hunt for dates everywhere including small print, cover, title page, the run of performances, a season line, and any copyright or issue date. IMPORTANT: if any image is a ticket, stub, receipt or booking confirmation, the performance date printed on it is the date the user attended — put it in "exact" and let it override any date from the program, even a printed run or a slip. Put the performance time and the seat from a ticket into "notes" if legible, for example "Ticket: Fri 7:30pm, Orch H12". A ticket also settles the venue. "exact" is YYYY-MM-DD only when one single performance date is printed. "monthYear" is YYYY-MM and should be filled whenever the program names a month and year even without a day — Playbill and most house programs print the issue month and year on the cover or masthead (for example "DECEMBER 2013"), and that is the month of the performance, so capture it. A two-year season line such as "2011-2012 Season" is NOT a monthYear; leave it in printed only. "rangeStart" and "rangeEnd" are YYYY-MM-DD when a run or repertory span is printed. "printed" is the date text copied exactly as it appears, for example "March 4-22, 2019" or "2011-2012 Season". Never guess a date that is not printed. director is the stage director of this production, the person credited "Directed by" — not the music director, artistic director or conductor; leave it "" for a concert or recital with no director. creatives: up to 6 others (writer, composer, conductor, choreographer, designer); do not repeat the director there. cast: up to 40 performers who appeared, principals first, with the character each plays. understudies: up to 25 entries from the understudy, standby, swing or cover list, each with the performer and the role or roles they cover; leave empty if no such list is printed. IMPORTANT: if a loose slip or insert announces that a role is played by someone else at this performance, put that performer in "cast" for that role instead of the printed name, and say so plainly in "notes", for example "Slip: Elphaba played by Jane Doe". notes: one short line, else "". Use "" for anything unreadable.';

// A reply cut off mid-list leaves unclosed brackets. Trim to the last complete
// entry and close what is open, so a long cast list is shortened rather than lost.
function repairJson(text){
  const cut = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
  if (cut < 0) return null;
  let out = text.slice(0, cut + 1);
  const stack = []; let inStr = false, esc = false;
  for (const ch of out){
    if (esc) { esc = false; continue; }
    if (ch === "\\") { if (inStr) esc = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === "{" || ch === "[") stack.push(ch === "{" ? "}" : "]");
    else if (ch === "}" || ch === "]") stack.pop();
  }
  out = out.replace(/,\s*$/, "");
  while (stack.length) out += stack.pop();
  return out;
}

let lastReadTruncated = false;

async function readProgram(images){
  const key = apiKey();
  if(!key) throw new Error("Add a Claude API key in Season → Settings, or type the show in by hand.");
  const content = images.map(d => ({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:d.split(",")[1] } }));
  content.push({ type:"text", text:PROMPT });
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:apiModel(), max_tokens:8000, messages:[{ role:"user", content }] })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status===401 ? "That Claude API key was refused. Check it in Season → Settings."
      : res.status===402 ? "The Claude account needs credits — add them in the Claude Console."
      : "The reader could not reach Claude (" + res.status + "). " + t.slice(0,120));
  }
  const data = await res.json();
  const text = (data.content||[]).filter(b => b.type==="text").map(b => b.text).join("\n");
  const c = text.replace(/```json/g,"").replace(/```/g,"").trim();
  const a = c.indexOf("{");
  if(a<0) throw new Error("Nothing readable came back. Try a brighter, straighter photo.");
  const body = c.slice(a);
  lastReadTruncated = data.stop_reason === "max_tokens";
  try {
    return JSON.parse(body.slice(0, body.lastIndexOf("}") + 1));
  } catch {
    const repaired = repairJson(body);
    if(!repaired) throw new Error("The reply came back unreadable. Try again, or with fewer pages at once.");
    lastReadTruncated = true;
    return JSON.parse(repaired);   // throws only if it is beyond saving
  }
}

/* ============ helpers ============ */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function groupCast(list){
  const order = [], byActor = {};
  (list||[]).forEach(c => {
    const name = (c.actor||"").trim();
    if(!name) return;
    if(!byActor[name]){ byActor[name] = []; order.push(name); }
    if(c.role && c.role.trim()) byActor[name].push(c.role.trim());
  });
  return order.map(name => ({ actor:name, role:byActor[name].join(", ") }));
}
function castToText(cast){ return (cast||[]).map(c => c.actor + (c.role ? " as " + c.role : "")).join("\n"); }
function textToCast(t){
  return (t||"").split("\n").filter(l => l.trim()).map(l => {
    const i = l.toLowerCase().indexOf(" as ");
    return i>-1 ? { actor:l.slice(0,i).trim(), role:l.slice(i+4).trim() } : { actor:l.trim(), role:"" };
  });
}
function sortEntries(list){ return list.sort((a,b) => (b.dateSeen||"0").localeCompare(a.dateSeen||"0")); }
function download(text, filename, mime){
  try { const url = URL.createObjectURL(new Blob([text], { type:mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true; } catch { return false; }
}
function copyText(text){
  const legacy = () => { try { const ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta); say("Copied — paste it somewhere safe");
    } catch { fail("Copying is blocked. Tap the box, select all, and copy by hand."); } };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => say("Copied — paste it somewhere safe"), legacy);
  else legacy();
}

/* ============ the shared log ============ */
async function loadPages(id){
  const snap = await getDocs(collection(db, "shows", id, "pages"));
  return snap.docs.map(d => d.data()).sort((a,b) => a.n - b.n);
}
async function writeShow(rec, pages){
  const b = writeBatch(db);
  b.set(doc(db, "shows", rec.id), clean(rec));
  if (Array.isArray(pages)){
    const existing = await getDocs(collection(db, "shows", rec.id, "pages"));
    existing.forEach(p => b.delete(p.ref));          // clear the old set first
    pages.forEach((p, i) => {
      const v = typeof p === "string" ? { thumb:p, full:p } : p;
      b.set(doc(db, "shows", rec.id, "pages", pad(i)), { n:i, thumb:v.thumb || v.full, full:v.full || v.thumb });
    });
  }
  return b.commit();
}
async function removeShow(id){
  const pages = await getDocs(collection(db, "shows", id, "pages"));
  const b = writeBatch(db);
  pages.forEach(p => b.delete(p.ref));
  b.delete(doc(db, "shows", id));
  return b.commit();
}
async function importShows(entries, pagesMap){
  let n = 0;
  for (const e of entries){
    if (!e || !e.id || !e.title) continue;
    const rec = Object.assign({}, e, {
      addedBy: e.addedBy || S.user.email, addedByName: e.addedByName || firstName(S.user),
      pageCount: (pagesMap[e.id] || []).length || e.pageCount || 0
    });
    await writeShow(rec, pagesMap[e.id] || []);
    n++;
  }
  return n;
}

// the rows the current search and filters are showing, in the chosen order
function visibleLog(){
  const q = S.query.trim().toLowerCase();
  let list = S.entries.slice();
  if (S.kindFilter !== "All") list = list.filter(e => kindOf(e) === S.kindFilter);
  if (q) list = list.filter(e => {
    if([e.title,e.venue,e.city,e.company,e.notes,e.addedByName,e.kind,e.director].join(" ").toLowerCase().includes(q)) return true;
    if((e.creatives||[]).some(c => (c.name+" "+c.role).toLowerCase().includes(q))) return true;
    return (e.cast||[]).concat(e.understudies||[]).some(c => (c.actor+" "+c.role).toLowerCase().includes(q));
  });
  const undatedLast = (a,b,dir) => {
    if(!a.dateSeen && !b.dateSeen) return 0;
    if(!a.dateSeen) return 1;
    if(!b.dateSeen) return -1;
    return dir * a.dateSeen.localeCompare(b.dateSeen);
  };
  if(S.sort==="new") list.sort((a,b) => undatedLast(a,b,-1));
  else if(S.sort==="old") list.sort((a,b) => undatedLast(a,b,1));
  else if(S.sort==="title") list.sort((a,b) => a.title.localeCompare(b.title));
  else if(S.sort==="kind") list.sort((a,b) => kindOf(a).localeCompare(kindOf(b)) || undatedLast(a,b,-1));
  return list;
}

    + ' from the earlier, unshared version. <button class="btn sm" style="margin-top:10px" data-act="movelegacy"'
    + (S.moving?" disabled":"")+'>'+(S.moving?"Moving…":"Move them into the shared log")+'</button></div>';

  h += '<label style="margin-bottom:10px"><input type="text" placeholder="Search titles, people, venues, notes" value="'+esc(S.query)+'" data-field="query"></label>';

  if(S.selectMode){
    const n = Object.keys(S.picked).length;
    h += '<div style="border:1px solid var(--brass);background:var(--stock);padding:12px;margin-bottom:12px">'
      + '<div class="row"><span class="small">' + (n ? n + ' selected' : 'Tap shows to select them') + '</span>'
      + '<span>'
      + (list.length ? '<button class="btn sm ghost" style="margin-right:6px" data-act="pickall">Select these ' + list.length + '</button>' : '')
      + (n ? '<button class="btn sm" style="margin-right:6px" data-act="removepicked">Remove ' + n + '</button>' : '')
      + '<button class="btn sm ghost" data-act="selectoff">Done</button></span></div>'
      + (n ? '<p class="tiny muted" style="margin:8px 0 0">Removing also deletes any programme pages on those entries.</p>' : '')
      + '</div>';
  } else {
    h += '<div style="text-align:right;margin-bottom:10px"><button class="btn sm ghost" data-act="selecton">Select several</button></div>';
  }

  if(S.entries.length){
    const counts = {};
    S.entries.forEach(e => { const k = kindOf(e); counts[k] = (counts[k]||0)+1; });
    const present = KINDS.filter(k => counts[k]).concat(counts["Unsorted"] ? ["Unsorted"] : []);
    if(present.length >= 1 && S.entries.length > 1){
      h += '<div style="margin-bottom:10px">'
        + '<button class="seg'+(S.kindFilter==="All"?" on":"")+'" data-act="kind:All">All '+S.entries.length+'</button>'
        + present.map(k => '<button class="seg'+(S.kindFilter===k?" on":"")+'" data-act="kind:'+k+'">'+k+' '+counts[k]+'</button>').join("")
        + '</div>';
    }
    h += '<div class="row" style="margin-bottom:14px"><span class="tiny muted">'
      + (q || S.kindFilter!=="All" ? list.length + " of " + S.entries.length + " shows" : list.length + (list.length===1?" show":" shows"))
      + (q ? ' · <button class="tab" style="border:0;padding:0;font-size:11px" data-act="clearq">clear</button>' : '')
      + '</span><span>'
      + [["new","Newest"],["old","Oldest"],["title","A–Z"],["kind","Kind"]].map(o =>
          '<button class="seg'+(S.sort===o[0]?" on":"")+'" style="margin-right:4px" data-act="sort:'+o[0]+'">'+o[1]+'</button>').join("")
      + '</span></div>';
  }

  if(!S.entries.length) return h + '<div class="gate" style="padding:40px 0"><div class="serif" style="font-size:22px;margin-bottom:6px">The log is empty</div>'
    + '<p class="small muted">Start with the last playbill in your bag.</p>'
    + '<button class="btn" style="max-width:200px;margin:0 auto" data-act="tab:add">Add a show</button></div>';
  if(!list.length){
    // say which filter is doing the excluding, and offer the way out
    const inKind = S.kindFilter === "All" ? S.entries
      : S.entries.filter(e => kindOf(e) === S.kindFilter);
    const qOnly = q ? S.entries.filter(e =>
        [e.title,e.venue,e.city,e.company,e.notes,e.addedByName,e.kind,e.director].join(" ").toLowerCase().includes(q)
        || (e.creatives||[]).some(c => (c.name+" "+c.role).toLowerCase().includes(q))
        || (e.cast||[]).concat(e.understudies||[]).some(c => (c.actor+" "+c.role).toLowerCase().includes(q))) : [];
    let msg, fix = "";
    if(q && S.kindFilter !== "All" && qOnly.length){
      msg = "No " + S.kindFilter + " shows match \u201c" + q + "\u201d, but " + qOnly.length
          + " show" + (qOnly.length===1?"":"s") + " match" + (qOnly.length===1?"es":"") + " across all kinds.";
      fix = '<button class="btn outline" style="max-width:280px;margin:14px auto 0" data-act="kind:All">Show all ' + qOnly.length + '</button>';
    } else if(q){
      msg = "Nothing matches \u201c" + q + "\u201d.";
      fix = '<button class="btn ghost" style="max-width:280px;margin:14px auto 0" data-act="clearq">Clear the search</button>';
    } else {
      msg = "No " + S.kindFilter + " shows in the log yet.";
      fix = '<button class="btn ghost" style="max-width:280px;margin:14px auto 0" data-act="kind:All">Show all ' + S.entries.length + '</button>';
    }
    return h + '<div style="text-align:center;padding:32px 0"><p class="small muted">' + esc(msg) + '</p>' + fix + '</div>';
  }

  return h + list.map(e => {
    const s = stubParts(e.dateSeen);
    const distinct = groupCast(e.cast);
    let names = distinct.slice(0,3).map(c => c.actor).join(", ");
    if(distinct.length>3) names += " +" + (distinct.length-3);
    const where = [e.venue, e.city].filter(Boolean).join(", ") || "Venue not recorded";
    const picked = !!S.picked[e.id];
    return '<button class="stub'+(picked?" picked":"")+'" data-act="'+(S.selectMode?"pick:":"open:")+e.id+'">'
      + (S.selectMode ? '<span class="tick">'+(picked?"\u2713":"")+'</span>' : '')
      + '<span class="date">'
      + (s.eyebrow ? '<span class="d-mon">'+s.eyebrow+'</span>' : '')
      + '<span class="d-day"'+(s.sub==="undated"?' style="color:var(--muted)"':'')+'>'+esc(s.big)+'</span>'
      + (s.sub ? '<span class="d-yr">'+esc(s.sub)+'</span>' : '')
      + '</span><span class="body">'
      + '<span class="title truncate">'+esc(e.title)+'</span>'
      + '<span class="credit truncate"><span class="k">'+esc(kindOf(e))+'</span> at '+esc(where)+'</span>'
      + (names ? '<span class="players truncate">'+esc(names)+'</span>' : '')
      + '</span></button>';
  }).join("");
}

  if(S.openPages === null && e.pageCount) h += '<p class="tiny muted">Loading pages…</p>';
  if((S.openPages||[]).length) h += '<div class="strip">' + S.openPages.map((p,i) =>
      '<img src="'+p.thumb+'" alt="Page '+(i+1)+'" data-act="light:'+i+'">').join("") + '</div>';

  h += (house ? '<div class="meta" style="text-align:center;letter-spacing:.14em;text-transform:uppercase">'+esc(house)+'</div>' : '')

  if(e.director) h += '<div class="small dim" style="text-align:center;margin-top:12px">Directed by '+esc(e.director)+'</div>';

    : '<p class="small muted">No cast recorded.</p>';
  if((e.understudies||[]).length) h += '<div class="hr"></div><div class="eyebrow">Understudies and standbys</div>'
    + groupCast(e.understudies).map(c => '<div class="kv"><span class="muted">'+esc(c.actor)+'</span><i class="lead"></i><span>'+esc(c.role)+'</span></div>').join("");

    + '<button class="btn ghost" style="margin:0" data-act="del">Remove</button></div></div>';
  return h;
}

  h += '<div style="background:var(--house);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px"><div class="meta" style="margin-bottom:8px">Date you saw it</div>';
  h += info.printed
    ? '<p class="small dim" style="margin:0 0 10px">On the program: <span style="color:var(--brass)">'+esc(info.printed)+'</span>'+(info.rangeStart ? ' — a run of performances, so pick the night you were there.' : '')+'</p>'
    : '<p class="small muted" style="margin:0 0 10px">No date printed on this program. Add what you know — a year alone is fine.</p>';
  const chips = [];
  if(info.exact && info.exact !== d.dateSeen) chips.push(["Use the printed date", info.exact]);
  if(info.monthYear && info.monthYear !== d.dateSeen) chips.push([fmtDate(info.monthYear), info.monthYear]);
  const fromLine = inferFromPrinted(info.printed);
  if(fromLine && fromLine !== d.dateSeen && fromLine !== info.monthYear && fromLine !== info.exact)
    chips.push(["Use " + fmtDate(fromLine), fromLine]);
  if(info.rangeStart) chips.push(["First night · " + fmtDate(info.rangeStart), info.rangeStart]);
  if(info.rangeEnd && info.rangeEnd !== info.rangeStart) chips.push(["Last night · " + fmtDate(info.rangeEnd), info.rangeEnd]);
  if(info.rangeStart) chips.push(["Just " + fmtDate(info.rangeStart.slice(0,7)), info.rangeStart.slice(0,7)]);
  if(chips.length) h += '<div style="margin-bottom:10px">' + chips.map(c => '<button class="chip" data-act="chip:'+c[1]+'">'+esc(c[0])+'</button>').join("") + '</div>';
  h += '<div style="margin-bottom:10px">' + [["day","Exact day"],["month","Month"],["year","Year only"]].map(o =>
      '<button class="seg'+(p===o[0]?" on":"")+'" data-act="prec:'+o[0]+'">'+o[1]+'</button>').join("") + '</div>';
  if(p==="day") h += '<input type="date" data-field="date" value="'+esc(d.dateSeen.length>=10?d.dateSeen:"")+'">';
  else if(p==="month") h += '<input type="month" data-field="date" value="'+esc(d.dateSeen.length>=7?d.dateSeen.slice(0,7):"")+'">';
  else h += '<input type="number" data-field="date" min="1850" max="2100" placeholder="1998" value="'+esc(d.dateSeen?d.dateSeen.slice(0,4):"")+'">';
  h += '<p class="tiny muted" style="margin:8px 0 0">Filed as: <span id="filedAs" style="color:var(--paper)">'+esc(fmtDate(d.dateSeen))+'</span>'
    + (d.dateAuto && d.dateSeen ? ' — taken from the program. Change it if you were there on another night.' : '')
    + '</p></div>';
  h += '<div class="grid2"><label><span>Venue</span><input type="text" data-field="venue" value="'+esc(d.venue)+'"></label>'

    + '<label><span>Director</span><input type="text" data-field="director" value="'+esc(d.director)+'" placeholder="Leave blank if none"></label>'
    + '<label><span>Creative team — one per line, “Director: Name”</span><textarea rows="4" data-field="creativesText">'+esc(d.creativesText)+'</textarea></label>'
    + '<label><span>Cast — one per line, “Actor as Role”</span><textarea rows="8" data-field="castText">'+esc(d.castText)+'</textarea></label>'
    + '<label><span>Understudies and standbys — “Actor as Role”</span><textarea rows="5" data-field="understudyText">'+esc(d.understudyText)+'</textarea></label>'
    + '<label><span>Notes</span><input type="text" data-field="notes" value="'+esc(d.notes)+'" placeholder="Understudy on, seats, who came along"></label>'
    + '<div style="display:flex;gap:10px"><button class="btn" style="margin:0" data-act="save">File this show</button>'
    + '<button class="btn ghost" style="margin:0;width:auto;padding:14px 18px" data-act="discard">Discard</button></div></div>';
  return h;
}

// Titles can differ wildly for the same show ("ROI" vs "R.O.I. (Return on Investment)").
// Two entries on the same date, at the same venue, are almost always one performance.
// venues get written a dozen ways: "SHN Golden Gate", "Golden Gate Theatre", "Golden Gate"
function normVenue(v){
  return (v||"").toLowerCase()
    .replace(/\b(shn|act|a\.c\.t\.?|american conservatory|the)\b/g,"")
    .replace(/\b(theatre|theater|hall|center|centre|house)\b/g,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}
function findDuplicatePairs(loose){
  const byDay = {};
  S.entries.forEach(e => {
    if(!e.dateSeen) return;
    (byDay[e.dateSeen.slice(0,10)] = byDay[e.dateSeen.slice(0,10)] || []).push(e);
  });
  const pairs = [];
  Object.keys(byDay).forEach(d => {
    const list = byDay[d];
    for(let i = 0; i < list.length; i++){
      for(let j = i + 1; j < list.length; j++){
        const a = list[i], b = list[j];
        const va = normVenue(a.venue), vb = normVenue(b.venue);
        const sameVenue = va && vb && (va === vb || va.includes(vb) || vb.includes(va));
        const alike = titleAlike(a.title, b.title);
        // a bare first word in common is weak on its own but telling on the same night
        const firstWord = x => normTitle(x.title).split(" ")[0] || "";
        const sameStart = firstWord(a).length > 3 && firstWord(a) === firstWord(b);
        const strong = sameVenue || alike || sameStart;
        if(!strong && !loose) continue;
        const score = x => (x.cast||[]).length * 3 + (x.pageCount||0) * 5
                         + ((x.creatives||[]).length) + (x.fromCalendar ? -10 : 0);
        const keep = score(a) >= score(b) ? a : b;
        const drop = keep === a ? b : a;
        pairs.push({ keep, drop, strong,
          why: sameVenue ? "same night, same venue"
             : alike ? "same night, similar title"
             : sameStart ? "same night, same opening word"
             : "same night, different venue" });
      }
    }
  });
  return pairs;
}

async function mergePair(keepId, dropId){
  const keep = S.entries.find(e => e.id === keepId);
  const drop = S.entries.find(e => e.id === dropId);
  if(!keep || !drop) return;
  const merged = Object.assign({}, keep);
  // take anything the kept record is missing
  ["venue","city","company","director","kind"].forEach(f => { if(!merged[f] && drop[f]) merged[f] = drop[f]; });
  if(!(merged.cast||[]).length && (drop.cast||[]).length) merged.cast = drop.cast;
  if(!(merged.understudies||[]).length && (drop.understudies||[]).length) merged.understudies = drop.understudies;
  if(!(merged.creatives||[]).length && (drop.creatives||[]).length) merged.creatives = drop.creatives;
  const dn = (drop.notes||"").replace(/Imported from calendar[^.]*\.?/i,"").trim();
  if(dn && !(merged.notes||"").includes(dn)) merged.notes = merged.notes ? merged.notes + " " + dn : dn;
  merged.notes = (merged.notes||"").replace(/Imported from calendar[^.]*\.?/i,"").trim();
  merged.fromCalendar = false;
  merged.updatedAt = Date.now();
  await writeShow(merged, null);
  await removeShow(drop.id);
  S.dupDismissed = S.dupDismissed || {};
}

  const field = a && a.getAttribute ? a.getAttribute("data-field") : null;
  let sel = null; try { sel = field ? [a.selectionStart, a.selectionEnd] : null; } catch {}

  if (S.phase !== "app") { app.innerHTML = viewGate(); return; }

  let body = "";
  if(S.openId && S.tab==="log") body = viewDetail();
  else if(S.tab==="log") body = viewLog();
  else if(S.tab==="add") body = viewAdd();
  else body = viewSeason();

  const lightsDown = document.documentElement.getAttribute("data-lights") === "down";
  let head = '<div class="marquee"><span>I Saw That</span></div>'
    + '<div class="colophon">'
    + '<span>' + S.entries.length + (S.entries.length===1 ? " performance" : " performances") + '</span>'
    + '<span>shared log</span>'
    + '<span>' + (S.syncing ? "syncing" : "saved") + '</span>'
    + '<span>' + BUILD + '</span></div>'
    + '<button class="lights" data-act="lights">' + (lightsDown ? "Raise the houselights" : "Dim the houselights") + '</button>'

  if(S.tab === "season") head += '<p class="tiny muted" style="text-align:right;margin:-8px 0 10px">build ' + BUILD + '</p>';
  const tabs = [["log","The log"],["add","Add a show"],["season","Season"]].map(t =>
    '<button class="tab'+(S.tab===t[0]?" on":"")+'" data-act="tab:'+t[0]+'">'+t[1]+'</button>').join("");
  const light = S.lightbox ? '<div class="lightbox" data-act="closelight"><img src="'+S.lightbox+'" alt="Program page"></div>' : "";

function directorFrom(creatives){
  const hit = (creatives||[]).find(c => /direct/i.test(c.role || "")
    && !/music|musical|artistic|casting|technical|associate|assistant/i.test(c.role || ""));
  return hit ? (hit.name || "") : "";
}

function newDraft(base){
  base = base || {};
  // a fresh scan should never land with an empty date when the program says one
  let ds = base.dateSeen || "";
  let auto = !!base.dateAuto;
  if (!ds && base.pagesNew && base.dateInfo){
    ds = (base.dateInfo.exact || "")
      || (/^\d{4}-\d{2}$/.test(base.dateInfo.monthYear || "") ? base.dateInfo.monthYear : "")
      || inferFromPrinted(base.dateInfo.printed);
    if (ds) auto = true;
  }
  return {
    id: base.id || newId(), title: base.title||"", kind: base.kind || "Theatre",
    director: base.director || directorFrom(base.creatives), company: base.company||"", venue: base.venue||"",
    city: base.city||"", dateSeen: ds, datePrecision: precisionOf(ds) || base.datePrecision || "day",
    dateInfo: base.dateInfo || { exact:"", rangeStart:"", rangeEnd:"", printed:"" },
    creativesText: (base.creatives||[]).map(c => (c.role ? c.role + ": " : "") + c.name).join("\n"),
    castText: castToText(base.cast), understudyText: castToText(base.understudies), notes: base.notes||"",
    pageViews: base.pageViews||[], pagesNew: !!base.pagesNew,
    dateAuto: auto,
    addedBy: base.addedBy, addedByName: base.addedByName, savedAt: base.savedAt
  };
}
function textToCreatives(t){
  return (t||"").split("\n").filter(l => l.trim()).map(l => {
    const i = l.indexOf(":");
    return i>-1 ? { role:l.slice(0,i).trim(), name:l.slice(i+1).trim() } : { role:"", name:l.trim() };
  });
}

async function scanPending(){
  if(!S.pending.length) return;
  S.busy = true; S.error = ""; render();
  try {
    const parsed = await readProgram(S.pending.map(p => p.read));
    const di = parsed.dateInfo || {};
    const info = { exact:di.exact||"", monthYear:di.monthYear||"", rangeStart:di.rangeStart||"", rangeEnd:di.rangeEnd||"", printed:di.printed||"" };
    let seen = "";
    if(info.exact) seen = info.exact;                                  // one printed performance date
    else if(/^\d{4}-\d{2}$/.test(info.monthYear || "")) seen = info.monthYear;   // masthead month and year
    else if(info.rangeStart && info.rangeStart.slice(0,7) === (info.rangeEnd||info.rangeStart).slice(0,7)) seen = info.rangeStart.slice(0,7);
    else if(info.rangeStart && info.rangeStart.slice(0,4) === (info.rangeEnd||info.rangeStart).slice(0,4)) seen = info.rangeStart.slice(0,4);
    else seen = inferFromPrinted(info.printed);                        // anything legible in the date line
    S.draft = newDraft({
      title:parsed.title, kind:(KINDS.includes(parsed.kind) ? parsed.kind : "Theatre"), director:parsed.director||"",
      company:parsed.company, venue:parsed.venue, city:parsed.city,
      dateSeen:seen, dateInfo:info,
      creatives:(parsed.creatives||[]).filter(c => c && c.name),
      cast:(parsed.cast||[]).filter(c => c && c.actor),
      understudies:(parsed.understudies||[]).filter(c => c && c.actor),
      notes:parsed.notes, dateAuto: !!seen,
      pageViews:S.pending.map(p => ({ thumb:p.thumb, full:p.full })), pagesNew:true
    });
    S.pending = [];
    if(lastReadTruncated) S.error = "That program was long enough that the reading was cut short — check the cast and understudy lists and add anyone missing.";
  } catch(err){ S.error = err.message || "Something went wrong reading that program."; }
  S.busy = false; render();
}

// A scan often belongs to a show already in the log — a calendar import waiting
// for its programme. Match on title, then require the dates to be close.
function normTitle(t){
  return (t||"").toLowerCase()
    .replace(/[\u2018\u2019\u201c\u201d'"`]/g,"")
    .replace(/^(the|a|an)\s+/,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}
function titleAlike(a, b){
  a = normTitle(a); b = normTitle(b);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length > 4 && b.length > 4 && (a.includes(b) || b.includes(a))) return true;
  const A = new Set(a.split(" ").filter(w => w.length > 2));
  const B = new Set(b.split(" ").filter(w => w.length > 2));
  // one significant word is not enough to call it the same show ("John" vs "John Proctor")
  if(A.size < 2 || B.size < 2) return false;
  let hit = 0; A.forEach(w => { if(B.has(w)) hit++; });
  return hit / Math.min(A.size, B.size) >= 0.75;
}
function daysApart(a, b){
  if(!a || !b) return 9999;
  const pa = a.length >= 10 ? a : a.length === 7 ? a + "-15" : a + "-07-01";
  const pb = b.length >= 10 ? b : b.length === 7 ? b + "-15" : b + "-07-01";
  return Math.abs((new Date(pa + "T00:00:00") - new Date(pb + "T00:00:00")) / 86400000);
}
function findExisting(draft){
  const cands = S.entries.filter(e => e.id !== draft.id && titleAlike(e.title, draft.title));
  if(!cands.length) return null;
  // prefer a calendar import, then the closest date
  const scored = cands.map(e => ({ e, d: daysApart(e.dateSeen, draft.dateSeen) }))
    .filter(x => x.d <= 21)
    .sort((x,y) => (y.e.fromCalendar?1:0) - (x.e.fromCalendar?1:0) || x.d - y.d);
  return scored.length ? scored[0].e : null;
}

function saveDraft(){
  const d = S.draft;
  if(!d.title.trim()) return fail("A show needs a title before it goes in the log.");

  // this scan may be filling in a show already on the list
  if(!S.mergeChecked && !S.entries.some(e => e.id === d.id)){
    const hit = findExisting(d);
    if(hit){ S.mergeWith = hit; S.mergeChecked = true; return render(); }
  }
  S.mergeChecked = false;
  const isNew = !S.entries.some(e => e.id === d.id);
  const rec = {
    id:d.id, title:d.title.trim(), kind:d.kind || "Theatre", director:(d.director||"").trim(),
    company:d.company, venue:d.venue, city:d.city,
    dateSeen:d.dateSeen, datePrecision:precisionOf(d.dateSeen) || d.datePrecision,
    dateInfo:d.dateInfo, creatives:textToCreatives(d.creativesText), cast:textToCast(d.castText),
    understudies:textToCast(d.understudyText), notes:d.notes,
    pageCount:(d.pageViews||[]).length, savedAt:d.savedAt || Date.now(), updatedAt:Date.now(),
    addedBy:d.addedBy || S.user.email, addedByName:d.addedByName || firstName(S.user),
    fromCalendar: d.fromCalendar && !(d.cast||[]).length ? true : false
  };
  if(!isNew) rec.editedBy = firstName(S.user);
  const pages = d.pagesNew ? (d.pageViews || []) : null;
  S.draft = null; S.tab = "log";
  say(rec.title + (isNew ? " filed" : " updated"));
  // Firestore shows the change locally at once and syncs in the background, even offline.
  writeShow(rec, pages)
    .catch(err => fail("That change did not reach the shared log: " + (err.message || err.code)));
}

async function buildBackup(withPages){
  const payload = { app:"i-saw-that", version:2, exportedAt:new Date().toISOString(), entries:S.entries, pages:{} };
  if(withPages){
    const todo = S.entries.filter(e => e.pageCount);
    // in parallel batches: one at a time takes minutes and looks like nothing is happening
    const BATCH = 8;
    for(let i = 0; i < todo.length; i += BATCH){
      const slice = todo.slice(i, i + BATCH);
      S.busyNote = "Gathering programme pages \u2014 " + Math.min(i + BATCH, todo.length) + " of " + todo.length;
      render();
      await new Promise(r => setTimeout(r, 0));
      const got = await Promise.all(slice.map(async e => {
        try { return [e.id, (await loadPages(e.id)).map(p => ({ thumb:p.thumb, full:p.full }))]; }
        catch { return [e.id, null]; }
      }));
      got.forEach(([id, pages]) => { if(pages && pages.length) payload.pages[id] = pages; });
    }
    S.busyNote = "";
  }
  return JSON.stringify(payload);
}

async function restoreFromText(text){
  let data;
  try { data = JSON.parse(text); } catch { return fail("That text is not a backup file."); }
  if(!data || !Array.isArray(data.entries)) return fail("That text is not a backup file.");
  S.moving = true; S.error = ""; render();
  try {
    // A calendar import can name shows already scanned. The scanned copy has the cast
    // and the programme pages, so it wins — skip the stub rather than double the entry.
    const have = S.entries.slice();
    const incoming = [], skipped = [];
    for(const e of data.entries){
      if(!e || !e.id) continue;
      const dup = e.fromCalendar && !(e.cast||[]).length
        && have.find(x => x.id !== e.id && titleAlike(x.title, e.title) && daysApart(x.dateSeen, e.dateSeen) <= 21);
      if(dup) skipped.push([e, dup]); else { incoming.push(e); have.push(e); }
    }
    const n = await importShows(incoming, data.pages || {});
    S.pasteText = "";
    S.lastSkipped = skipped;
    if(skipped.length){
      S.error = "Added " + n + " show" + (n===1?"":"s") + ". Left out " + skipped.length
        + " that you have already scanned — your scanned versions are the fuller ones.";
    } else {
      say("Restored " + n + " show" + (n===1?"":"s") + " into the shared log");
    }
  } catch(err){ S.error = "Restore stopped partway: " + (err.message || err.code); }
  S.moving = false; render();
}

async function moveLegacy(){
  const list = legacyLog(); if(!list) return;
  const pages = {};
  list.forEach(e => { try { const p = JSON.parse(lsGet(LK.legacyPages + e.id) || "null"); if(p && p.length) pages[e.id] = p; } catch {} });
  S.moving = true; render();
  try {
    const n = await importShows(list, pages);
    lsSet(LK.moved, String(Date.now()));
    say("Moved " + n + " show" + (n===1?"":"s") + " into the shared log");
  } catch(err){ S.error = "The move stopped partway: " + (err.message || err.code) + ". Tap it again to finish."; }
  S.moving = false; render();
}

async function classifyUnsorted(){
  const todo = S.entries.filter(e => kindOf(e) === "Unsorted");
  if(!todo.length) return fail("Every show already has a kind.");
  if(!apiKey()) return fail("Classifying uses the Claude API key — add one in Settings below.");
  S.moving = true; S.error = ""; render();
  try {
    const brief = todo.map(e => ({ id:e.id, title:e.title, venue:e.venue||"", company:e.company||"",
      cast:(e.cast||[]).slice(0,3).map(c => c.actor).join(", ") }));
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":apiKey(), "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:apiModel(), max_tokens:2000, messages:[{ role:"user", content:
        'Classify each live performance below as exactly one of: ' + KINDS.join(", ") + '. '
        + 'A play is Theatre, a book musical is Musical, a symphony or recital is Classical, a jazz set is Jazz, '
        + 'a solo song evening is Cabaret, ballet or contemporary dance is Dance. Use what you know about these productions. '
        + 'Return ONLY a JSON object mapping each id to its kind, no commentary:\n' + JSON.stringify(brief) }] })
    });
    if(!res.ok) throw new Error("Claude returned " + res.status);
    const data = await res.json();
    const text = (data.content||[]).filter(b => b.type==="text").map(b => b.text).join("");
    const c = text.replace(/```json/g,"").replace(/```/g,"").trim();
    const map = JSON.parse(c.slice(c.indexOf("{"), c.lastIndexOf("}")+1));
    const b = writeBatch(db);
    let n = 0;
    todo.forEach(e => {
      const k = map[e.id];
      if(KINDS.includes(k)){ b.set(doc(db, "shows", e.id), { kind:k }, { merge:true }); n++; }
    });
    if(!n) throw new Error("Nothing came back that I could use.");
    await b.commit();
    say("Sorted " + n + " show" + (n===1?"":"s") + " by kind — check them and fix any that look wrong");
  } catch(err){ S.error = "Could not classify: " + (err.message || err.code); }
  S.moving = false; render();
}

function exportCsv(){
  const rows = [["Date seen","Printed on program","Title","Kind","Director","Venue","City","Company","Cast","Understudies","Notes","Filed by"]];
  S.entries.forEach(e => rows.push([e.dateSeen, (e.dateInfo&&e.dateInfo.printed)||"", e.title, e.kind||"", e.director||"", e.venue, e.city, e.company,
    (e.cast||[]).map(c => c.actor + (c.role?" as "+c.role:"")).join("; "),
    (e.understudies||[]).map(c => c.actor + (c.role?" as "+c.role:"")).join("; "), e.notes, e.addedByName]));
  S.backupText = rows.map(r => r.map(v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"').join(",")).join("\n");
  download(S.backupText, "i-saw-that.csv", "text/csv");
  render();
}

function authMessage(err){
  const c = err && err.code;
  if (c === "auth/unauthorized-domain") return "This web address is not on Firebase's list yet. In Firebase → Authentication → Settings → Authorized domains, add " + location.hostname + ".";
  if (c === "auth/popup-blocked") return "The sign-in window was blocked. Allow pop-ups for this site, or open it in Safari rather than from the home-screen icon.";
  if (c === "auth/operation-not-allowed") return "Google sign-in is not switched on. In Firebase → Authentication → Sign-in method, enable Google.";
  return (err && err.message) || "Sign-in did not work.";
}

/* ============ events ============ */
const appEl = document.getElementById("app");

appEl.addEventListener("click", ev => { handleClick(ev).catch(err => {
  // a button that does nothing is worse than a button that explains itself
  S.busyNote = "";
  S.error = "That did not work: " + (err && (err.message || err.code) || err);
  render();
}); });

async function handleClick(ev){
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const [act, ...rest] = el.getAttribute("data-act").split(":");
  const arg = rest.join(":");

  if(act==="signin"){
    S.error = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(err){ if(err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") { S.error = authMessage(err); render(); } }
    return;
  }
  if(act==="signout"){ await signOut(auth); return; }
  if(act==="tab"){ if(S.tab==="log" && arg!=="log") pushView(); S.tab = arg; S.openId = null; S.error = ""; return render(); }
  if(act==="lights"){
    const el = document.documentElement;
    const down = el.getAttribute("data-lights") === "down";
    if(down) el.removeAttribute("data-lights"); else el.setAttribute("data-lights","down");
    try { localStorage.setItem("cc:lights", down ? "up" : "down"); } catch {}
    return render();
  }
  if(act==="clearerr"){ S.error = ""; return render(); }
  if(act==="open"){
    pushView(); S.openId = arg; S.openPages = null; render();
    try { S.openPages = await loadPages(arg); } catch { S.openPages = []; }
    if (S.openId === arg) render();
    return;
  }
  if(act==="back"){ S.openId = null; S.openPages = null; return render(); }
  if(act==="edit"){
    const e = S.entries.find(x => x.id===S.openId);
    S.draft = newDraft(Object.assign({}, e, { pageViews:(S.openPages||[]).map(p => ({ thumb:p.thumb, full:p.full })), pagesNew:false }));
    S.openId = null; S.tab = "add"; return render();
  }
  if(act==="del"){
    if(!confirm("Remove this show from the shared log? It disappears for both of you.")) return;
    const id = S.openId; S.openId = null; S.openPages = null;
    say("Removed");
    removeShow(id).catch(err => fail("Could not remove it: " + (err.message || err.code)));
    return;
  }
  if(act==="movelegacy") return moveLegacy();
  if(act==="kind"){ S.kindFilter = arg; return render(); }
  if(act==="sort"){ S.sort = arg; return render(); }
  if(act==="clearq"){ S.query = ""; return render(); }
  if(act==="setkind"){ S.draft.kind = arg; return render(); }
  if(act==="find"){ S.query = decodeURIComponent(arg); S.kindFilter = "All"; S.tab = "log"; S.openId = null; return render(); }
  if(act==="bykind"){ S.kindFilter = decodeURIComponent(arg); S.query = ""; S.tab = "log"; S.openId = null; return render(); }
  if(act==="addpages"){ S.pageTarget = "tray"; document.getElementById("pageInput").click(); return; }
  if(act==="addtodraft"){ S.pageTarget = "draft"; document.getElementById("pageInput").click(); return; }
  if(act==="rmdpage"){
    S.draft.pageViews = S.draft.pageViews.filter((_, i) => i !== +arg);
    S.draft.pagesNew = true;
    return render();
  }
  if(act==="rmpage"){ S.pending = S.pending.filter(p => p.id!==arg); return render(); }
  if(act==="scan") return scanPending();
  if(act==="manual"){ S.draft = newDraft(null); return render(); }
  if(act==="mergeyes"){
    const m = S.mergeWith, d = S.draft;
    // the programme wins on detail; keep the date the calendar already knew if the scan has none
    d.id = m.id;
    d.dateSeen = d.dateSeen || m.dateSeen;
    d.venue = d.venue || m.venue;
    d.city = d.city || m.city;
    d.company = d.company || m.company;
    d.director = d.director || m.director;
    d.notes = (m.notes && !/Imported from calendar/i.test(m.notes) && m.notes !== d.notes)
      ? (d.notes ? m.notes + " — " + d.notes : m.notes) : d.notes;
    d.addedBy = m.addedBy; d.addedByName = m.addedByName; d.savedAt = m.savedAt;
    d.fromCalendar = false;
    S.mergeWith = null;
    return saveDraft();
  }
  if(act==="mergeno"){ S.mergeWith = null; return saveDraft(); }
  if(act==="save") return saveDraft();
  if(act==="discard"){ S.draft = null; S.mergeWith = null; S.mergeChecked = false; S.error = ""; return render(); }
  if(act==="prec"){
    const v = S.draft.dateSeen;
    if(v){
      if(arg==="year") S.draft.dateSeen = v.slice(0,4);
      else if(arg==="month") S.draft.dateSeen = v.length>=7 ? v.slice(0,7) : v.slice(0,4)+"-01";
      else S.draft.dateSeen = v.length>=10 ? v : (v.length===7 ? v : v.slice(0,4)+"-01") + "-01";
    }
    S.draft.datePrecision = arg; return render();
  }
  if(act==="chip"){ S.draft.dateSeen = arg; S.draft.datePrecision = precisionOf(arg); return render(); }
  if(act==="light"){ pushView(); S.lightbox = (S.openPages||[])[+arg].full; return render(); }
  if(act==="lightp"){ pushView(); S.lightbox = S.pending[+arg].full; return render(); }
  if(act==="lightd"){ pushView(); S.lightbox = S.draft.pageViews[+arg].full; return render(); }
  if(act==="closelight"){ S.lightbox = null; return render(); }
  if(act==="backup"){
    if(!S.entries.length) return fail("Nothing to back up yet.");
    if(S.busyNote) return;
    S.error = ""; S.busyNote = "Preparing the backup\u2026"; render();
    try { S.backupText = await buildBackup(arg==="full"); }
    catch(err){ S.busyNote = ""; return fail("Could not gather the backup: " + (err.message || err.code)); }
    S.busyNote = "";
    const mb = S.backupText.length / 1048576;
    const ok = download(S.backupText, "i-saw-that-" + new Date().toISOString().slice(0,10) + ".json", "application/json");
    S.error = "Backup ready \u2014 " + mb.toFixed(1) + " MB. "
      + (ok ? "Check your downloads. " : "This browser would not download it. ")
      + (mb > 4 ? "Too large to copy as text, so use a computer if the file did not arrive."
                : "You can also copy it from the box below.");
    return render();
  }
  if(act==="classify") return classifyUnsorted();
  if(act==="dupmerge"){
    const [keepId, dropId] = arg.split("|");
    S.busyNote = "Merging\u2026"; render();
    await mergePair(keepId, dropId);
    S.busyNote = ""; say("Merged");
    return;
  }
  if(act==="dupkeep"){
    S.dupDismissed = S.dupDismissed || {};
    S.dupDismissed[arg] = true;
    return render();
  }
  if(act==="duploose"){ S.dupLoose = true; return render(); }
  if(act==="duptight"){ S.dupLoose = false; return render(); }
  if(act==="dupdrop"){
    const [keepId, dropId] = arg.split("|");
    const a = S.entries.find(e => e.id === keepId), b = S.entries.find(e => e.id === dropId);
    if(!a || !b) return render();
    if(!confirm("Remove both of these for good?\n\n" + a.title + "\n" + b.title
      + "\n\nAny programme pages on them go too.")) return;
    S.busyNote = "Removing both\u2026"; render();
    try { await removeShow(dropId); await removeShow(keepId); }
    catch(err){ S.busyNote = ""; return fail("Could not remove: " + (err.message || err.code)); }
    S.busyNote = ""; say("Removed both");
    return;
  }
  if(act==="selecton"){ S.selectMode = true; S.picked = {}; return render(); }
  if(act==="selectoff"){ S.selectMode = false; S.picked = {}; return render(); }
  if(act==="pick"){
    if(S.picked[arg]) delete S.picked[arg]; else S.picked[arg] = true;
    return render();
  }
  if(act==="pickall"){
    // everything currently shown by the filters, not the whole log
    visibleLog().forEach(e => { S.picked[e.id] = true; });
    return render();
  }
  if(act==="removepicked"){
    const ids = Object.keys(S.picked);
    if(!ids.length) return;
    const titles = ids.slice(0,6).map(i => (S.entries.find(e => e.id === i)||{}).title).filter(Boolean);
    if(!confirm("Remove " + ids.length + " show" + (ids.length===1?"":"s") + " for good?\n\n"
        + titles.join("\n") + (ids.length > 6 ? "\n…and " + (ids.length - 6) + " more" : ""))) return;
    let done = 0;
    for(const id of ids){
      S.busyNote = "Removing \u2014 " + (++done) + " of " + ids.length; render();
      await new Promise(r => setTimeout(r, 0));
      try { await removeShow(id); } catch(err){ /* keep going, report at the end */ }
    }
    S.busyNote = ""; S.picked = {}; S.selectMode = false;
    say("Removed " + ids.length + " show" + (ids.length===1?"":"s"));
    return;
  }
  if(act==="clearskipped"){ S.lastSkipped = null; return render(); }
  if(act==="csv") return exportCsv();
  if(act==="copy") return copyText(S.backupText);
  if(act==="closebackup"){ S.backupText = ""; return render(); }
  if(act==="restorepaste") return restoreFromText(S.pasteText);
  if(act==="restorefile"){ document.getElementById("restoreInput").click(); return; }
  if(act==="savekey"){
    const key = (S.keyDraft === null ? apiKey() : S.keyDraft).trim();
    const model = (S.modelDraft === null ? apiModel() : S.modelDraft).trim() || "claude-sonnet-5";
    if(!key) return fail("Paste a key into the box first.");
    lsSet(LK.key, key); lsSet(LK.model, model);          // cached here for offline use
    S.cfg = { key, model }; S.keyDraft = null; S.modelDraft = null;
    say("Key saved — it works on both your phones now");
    setDoc(doc(db, "config", "claude"), { key, model, updatedAt: Date.now(), setBy: firstName(S.user) })
      .catch(err => fail("Saved on this device, but it did not reach the shared database: " + (err.message || err.code)));
    return;
  }
}

appEl.addEventListener("input", ev => {
  const f = ev.target.getAttribute("data-field"); if(!f) return;
  const val = ev.target.value;
  if(f==="query"){ S.query = val; return render(); }
  if(f==="paste"){ S.pasteText = val; return; }
  if(f==="apikey"){ S.keyDraft = val; return; }
  if(f==="model"){ S.modelDraft = val; return; }
  if(!S.draft) return;
  if(f==="date"){
    S.draft.dateSeen = S.draft.datePrecision==="year" ? val.slice(0,4) : val;
    const fa = document.getElementById("filedAs"); if(fa) fa.textContent = fmtDate(S.draft.dateSeen);
    return;
  }
  S.draft[f] = val;
});

document.getElementById("pageInput").addEventListener("change", async ev => {
  const files = Array.from(ev.target.files || []); ev.target.value = "";
  if(!files.length) return;
  const toDraft = S.pageTarget === "draft" && S.draft;
  const have = toDraft ? (S.draft.pageViews||[]).length : S.pending.length;
  const room = 8 - have;
  if(room <= 0) return fail("Eight pages is the limit for one show.");
  S.adding = true; S.error = ""; render();
  try {
    const added = await Promise.all(files.slice(0, room).map(preparePage));
    if (toDraft){
      S.draft.pageViews = (S.draft.pageViews||[]).concat(added.map(p => ({ thumb:p.thumb, full:p.full })));
      S.draft.pagesNew = true;
    } else {
      S.pending = S.pending.concat(added);
    }
    if(files.length > room) S.error = "Added " + room + " — eight pages is the limit.";
  } catch(err){ S.error = err.message || "One of those images would not open."; }
  S.adding = false; render();
});

document.getElementById("restoreInput").addEventListener("change", ev => {
  const file = (ev.target.files || [])[0]; ev.target.value = "";
  if(!file) return;
  const r = new FileReader();
  r.onload = () => restoreFromText(r.result);
  r.onerror = () => fail("That file could not be opened.");
  r.readAsText(file);
});

/* ============ boot ============ */
const configured = CONFIG.firebase.projectId && !String(CONFIG.firebase.apiKey).startsWith("PASTE");
if (!configured) { S.phase = "setup"; render(); }
else {
  const fb = initializeApp(CONFIG.firebase);
  auth = getAuth(fb);
  try { db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch { db = getFirestore(fb); }
  render();

  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (unsubCfg) { unsubCfg(); unsubCfg = null; }
    S.user = user; S.entries = []; S.openId = null; S.draft = null;
    if (!user) { S.phase = "signin"; return render(); }
    S.phase = "loading"; render();

    // the Claude key, shared between both of you
    S.cfg = { key: lsGet(LK.key) || "", model: lsGet(LK.model) || "claude-sonnet-5" };
    unsubCfg = onSnapshot(doc(db, "config", "claude"), snap => {
      if (!snap.exists()) return;
      const d = snap.data() || {};
      if (d.key) { S.cfg = { key: d.key, model: d.model || "claude-sonnet-5" };
        lsSet(LK.key, d.key); lsSet(LK.model, S.cfg.model); }
      if (S.tab === "season" && S.keyDraft === null) render();
    }, () => {});
    unsub = onSnapshot(collection(db, "shows"), { includeMetadataChanges: true }, snap => {
      S.entries = sortEntries(snap.docs.map(d => d.data()));
      S.syncing = snap.metadata.hasPendingWrites;
      S.phase = "app";
      // don't yank a form out from under someone mid-edit
      if (!(S.tab === "add" && S.draft) && !(S.tab === "season" && (S.keyDraft !== null || S.modelDraft !== null))) render();
    }, err => {
      if (err.code === "permission-denied") { S.phase = "denied"; render(); }
      else { S.phase = "app"; fail("Could not open the shared log: " + (err.message || err.code)); }
    });
  });
}
